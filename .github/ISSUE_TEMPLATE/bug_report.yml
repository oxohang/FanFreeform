name: Bug 反馈
description: 提交 HyperOS 兼容性问题、手势异常或小窗异常
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请先使用 Hyper手势“杂项设置”导出兼容性报告。上传前请检查并移除不希望公开的设备信息。
  - type: input
    id: version
    attributes:
      label: Hyper手势版本
      placeholder: 例如 1.0 (131)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统版本
      description: 请填写设备型号、HyperOS 完整版本和 Android 版本。
      placeholder: 例如 Xiaomi 17 / OS3.x.x.x / Android 16
    validations:
      required: true
  - type: input
    id: lsposed
    attributes:
      label: Root 与 LSPosed 环境
      description: 请填写 root 方案、LSPosed 版本以及已勾选的模块作用域。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从什么界面开始、如何操作、问题何时出现。
      placeholder: |
        1. 打开……
        2. 从……滑动
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际行为
      description: 请分别说明原本希望发生什么，以及实际发生了什么。
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: 兼容性报告与日志
      description: 将导出的报告和问题发生时的 LSPosed / logcat 日志拖到这里上传。不要粘贴账号、联系人或其他隐私信息。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已在 LSPosed 中启用模块并勾选系统界面与小米桌面。
          required: true
        - label: 我已确认附件不包含不希望公开的隐私信息。
          required: true
